name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        The catalogue is ebooks only, on purpose. A change Streamline itself has to make belongs in [Streamline](https://github.com/DataHearth/streamline/issues).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case, not the implementation.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
